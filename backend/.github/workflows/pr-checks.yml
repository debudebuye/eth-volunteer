name: Pull Request Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr-checks:
    name: PR Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run tests with coverage
        run: npm test -- --coverage
        env:
          NODE_ENV: test
          MONGO_URI: ${{ secrets.MONGO_URI_TEST }}
          JWT_SECRET: test-secret-key

      - name: Check code formatting
        run: npx prettier --check "**/*.{js,json,md}"

      - name: Check for console.logs
        run: |
          if grep -r "console\.log" src/ --exclude-dir=node_modules; then
            echo "❌ Found console.log statements in src/"
            echo "Please remove them or use the logger instead"
            exit 1
          else
            echo "✅ No console.log statements found"
          fi

      - name: Check bundle size
        run: |
          echo "Checking project size..."
          du -sh . | awk '{print "Total size: " $1}'

      - name: Comment PR
        uses: actions/github-script@v6
        if: always()
        with:
          script: |
            const output = `
            ## PR Checks Results 🎯
            
            ✅ Linting passed
            ✅ Tests passed
            ✅ Code formatting checked
            ✅ No console.logs found
            
            Great work! Your PR is ready for review.
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
